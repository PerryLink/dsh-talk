name: Feature request
description: Suggest a feature or improvement for dsh-talk
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Start from the problem, then describe the behavior you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem does this feature solve? What is missing or painful today?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should dsh-talk do instead? Describe the desired outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you use today, or alternative designs you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Anything else — screenshots, example config, related links.
    validations:
      required: false
