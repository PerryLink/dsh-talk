name: Bug report
description: Report a bug in dsh-talk
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster we can reproduce and fix it.

  - type: input
    id: package-version
    attributes:
      label: dsh-talk version
      description: The dsh-talk version you are using (e.g. `0.1.3`).
      placeholder: "0.1.3"
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness (dsh) version
      description: The harness version you run the plugin on (e.g. `0.1.1-rc.2`).
      placeholder: "0.1.1-rc.2"
    validations:
      required: true

  - type: input
    id: os-node
    attributes:
      label: OS and Node version
      description: Your operating system and Node version, e.g. `Windows 11, Node 22.19.0`.
      placeholder: "Ubuntu 24.04, Node 24.0.0"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reproduce the bug.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Press the mic / call the speak tool ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Any relevant logs, error output, or stack traces.

        **Warning: redact before pasting — do not include tokens, API keys, secrets, or Authorization/request headers.**
      render: shell
    validations:
      required: false
