# Nearest-workspace root for this standalone plugin package. This file makes
# pnpm treat dsh-talk as an independent workspace when the repository is
# checked out next to (or inside) other pnpm workspaces, such as a
# deepseek-harness checkout.
packages:
  - .

# pnpm 11 runs installs with dependency build scripts ignored by default
# (ERR_PNPM_IGNORED_BUILDS); the builds below are required for this package
# (esbuild: tsdown bundling; node-pty: the subprocess peer's PTY backend).
allowBuilds:
  esbuild: true
  node-pty: true
  '@deepseek-ai/dsh-subprocess-local': true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-api-remotes@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-connection@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-locale@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-credentials@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-deque@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-session-projection@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-session@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-subprocess@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-system-prompt@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-tools@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-user-approval@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-api-remotes@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-client-connection@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-client-locale@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-credentials@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-deque@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-session-projection@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-session@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-subprocess@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-system-prompt@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-tools@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-user-approval@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.5'

verifyDepsBeforeRun: false
# The exact alpha pins are published inside the 24h minimum-release-age
# window by design (every batch pins the newest published line); the
# exclusion list above is the primary mechanism, and this zero-age override
# keeps fresh installs deterministic when pnpm's lockfile policy re-checks.
minimumReleaseAge: 0
